<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>パスワード強度判定クイズ</title>
<style>
:root{--bg:#f4f7fb;--text:#172033;--muted:#667085;--line:#dce3ec;--low:#c62828;--mid:#b26a00;--high:#18743b;--lowbg:#fdecec;--midbg:#fff4df;--highbg:#e8f6ed}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#eef7f1 0,#f8fbfa 42%,#f4f7fb 100%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:650px;margin:auto}header{padding:24px 14px 16px}.home-link{display:inline-flex;text-decoration:none;color:#155b32;background:#e9f7ee;border:1px solid #c7e7d3;border-radius:999px;padding:8px 12px;font-size:13px;font-weight:800;margin-bottom:12px}
h1{font-size:27px;line-height:1.35;margin:0 0 8px}header p{color:var(--muted);margin:0;line-height:1.75}main{padding:0 10px 36px}
.note{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:13px;color:#475467;margin-bottom:12px}
.progressrow{display:flex;justify-content:space-between;font-size:14px;font-weight:800;margin:0 4px 7px}.bar{height:8px;background:#dfe7e2;border-radius:99px;overflow:hidden;margin:0 4px 14px}.bar>div{height:100%;background:#1d944c;transition:.25s}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px 16px;box-shadow:0 5px 20px rgba(20,40,30,.06)}.qnum{font-size:13px;color:#18743b;font-weight:900}.question{font-size:19px;font-weight:800;margin:7px 0 16px}
.password{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:clamp(22px,6vw,32px);font-weight:800;letter-spacing:.02em;padding:21px 14px;margin:0 0 18px;text-align:center;background:#111827;color:#fff;border-radius:14px;overflow-wrap:anywhere}
.options{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.option{min-height:58px;border-radius:14px;border:2px solid #d7dee8;background:#fff;font-size:17px;font-weight:900;cursor:pointer}
.option[data-value="低"]{color:var(--low)}.option[data-value="中"]{color:var(--mid)}.option[data-value="高"]{color:var(--high)}
.option.correct.low{background:var(--lowbg);border-color:#e99b9b}.option.correct.mid{background:var(--midbg);border-color:#e8be75}.option.correct.high{background:var(--highbg);border-color:#8bd0a3}.option.wrong{background:#f1f3f5;color:#667085;border-color:#aeb7c3}.option:disabled{cursor:default}
.feedback{display:none;margin-top:14px;padding:13px;border-radius:12px;font-size:14px;line-height:1.7}.feedback.show{display:block;background:#f8fafc;border:1px solid #dde4ee}
.next{display:none;width:100%;min-height:50px;margin-top:12px;border:0;border-radius:13px;background:#18743b;color:#fff;font-size:16px;font-weight:900}
.result{display:none;background:#fff;border:1px solid var(--line);border-radius:20px;padding:24px 16px;text-align:center}.score{font-size:58px;font-weight:900;line-height:1;margin:12px 0}
.legend{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:18px}.legend div{border-radius:12px;padding:10px 6px;font-size:13px;font-weight:800}.legend .l{background:var(--lowbg);color:var(--low)}.legend .m{background:var(--midbg);color:var(--mid)}.legend .h{background:var(--highbg);color:var(--high)}
.review{text-align:left;margin-top:20px}.reviewitem{padding:10px 0;border-top:1px solid #edf0f3;font-size:14px}
.restart,.topbtn{display:block;width:100%;min-height:48px;border:0;border-radius:13px;margin-top:10px;font-size:16px;font-weight:900;text-decoration:none;line-height:48px}.restart{background:#18743b;color:#fff}.topbtn{background:#eef4f0;color:#155b32}
@media(max-width:370px){.options{grid-template-columns:1fr}.option{min-height:48px}}
</style>
</head>
<body>
<header class="wrap"><a class="home-link" href="index.html">← 体験授業トップへ</a><h1>パスワード強度判定クイズ</h1><p>表示されたパスワードの安全性を「低・中・高」から選んでください。</p></header>
<main class="wrap">
<div class="note">全10問。ここでの「低・中・高」は学習用の目安です。実際には、十分な長さ、推測されにくさ、使い回しをしないこと、パスワードマネージャーの利用なども重要です。</div>
<div id="play">
<div class="progressrow"><span id="counter"></span><span id="running"></span></div><div class="bar"><div id="bar"></div></div>
<section class="card"><div class="qnum">PASSWORD CHECK</div><div class="question">このパスワードの安全性は？</div><div class="password" id="password"></div>
<div class="options"><button class="option" data-value="低">低</button><button class="option" data-value="中">中</button><button class="option" data-value="高">高</button></div>
<div class="feedback" id="feedback"></div><button class="next" id="next">次の問題へ</button></section>
</div>
<section id="result" class="result"><div style="font-size:13px;color:#18743b;font-weight:900">RESULT</div><h2>終了</h2><div class="score"><span id="score"></span>/10</div><div id="message"></div>
<div class="legend"><div class="l">低<br>推測されやすい</div><div class="m">中<br>改善の余地あり</div><div class="h">高<br>長く推測されにくい</div></div>
<button class="restart" id="restart">もう一度挑戦</button><a class="topbtn" href="index.html">体験授業トップへ戻る</a><div class="review"><h3>振り返り</h3><div id="review"></div></div></section>
</main>
<script>
const QUESTIONS = [{"password": "password", "level": "低", "explain": "非常によく使われる単語で、攻撃者が最初に試す候補に入りやすい例です。"}, {"password": "12345678", "level": "低", "explain": "数字の連続は規則が明確で、非常に推測されやすいパターンです。"}, {"password": "ayako2008", "level": "低", "explain": "名前＋年のような個人情報に結びつきやすい構造は、推測されやすくなります。"}, {"password": "Sakura123!", "level": "中", "explain": "文字種は多いものの、単語＋123＋記号という定番パターンで、十分に強いとは言えません。"}, {"password": "P@ssw0rd2026", "level": "中", "explain": "複雑そうに見えますが、passwordの典型的な文字置換と年の組み合わせで、攻撃側にも想定されやすい形です。"}, {"password": "Tokyo-8-Cat!", "level": "中", "explain": "一定の長さと文字種はありますが、短い単語を規則的につないだ構造なので、中程度とします。"}, {"password": "Coffee_Rain_728!", "level": "中", "explain": "ある程度長いものの、単語数が少なく構造が規則的です。より長く、無関係な語を増やすと強くできます。"}, {"password": "River!Piano7Cloud-Mango", "level": "高", "explain": "無関係な複数の単語を組み合わせて十分な長さを確保しており、短い定番パスワードより推測されにくい例です。"}, {"password": "Blue-Cactus_Train92!Moon", "level": "高", "explain": "十分に長く、複数の無関係な語・数字・記号を組み合わせているため、高とします。"}, {"password": "Glass7!Otter-Rocket_Peach", "level": "高", "explain": "長いパスフレーズ型で、単純な辞書語1個や定番置換パターンより推測されにくい例です。"}];
let order=[],pos=0,score=0,answered=false,history=[];
const $=id=>document.getElementById(id);
function shuffle(a){const x=[...a];for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]]}return x}
function start(){order=shuffle(QUESTIONS.map((_,i)=>i));pos=0;score=0;answered=false;history=[];$("play").style.display="block";$("result").style.display="none";render()}
function render(){answered=false;const q=QUESTIONS[order[pos]];$("counter").textContent=`問題 ${pos+1} / ${QUESTIONS.length}`;$("running").textContent=`正解 ${score}`;$("bar").style.width=`${(pos/QUESTIONS.length)*100}%`;$("password").textContent=q.password;$("feedback").className="feedback";$("feedback").textContent="";$("next").style.display="none";$("next").textContent=pos===QUESTIONS.length-1?"結果を見る":"次の問題へ";document.querySelectorAll(".option").forEach(b=>{b.disabled=false;b.className="option"})}
function choose(value,btn){if(answered)return;answered=true;const q=QUESTIONS[order[pos]];const ok=value===q.level;if(ok)score++;document.querySelectorAll(".option").forEach(b=>{b.disabled=true;if(b.dataset.value===q.level){b.classList.add("correct",q.level==="低"?"low":q.level==="中"?"mid":"high")}});if(!ok)btn.classList.add("wrong");$("feedback").className="feedback show";$("feedback").innerHTML=`<strong>${ok?"正解です。":"正解は「"+q.level+"」です。"}</strong><br>${q.explain}`;$("running").textContent=`正解 ${score}`;history.push({password:q.password,selected:value,expected:q.level,correct:ok});$("next").style.display="block"}
document.querySelectorAll(".option").forEach(b=>b.addEventListener("click",()=>choose(b.dataset.value,b)));
$("next").addEventListener("click",()=>{if(!answered)return;if(pos<QUESTIONS.length-1){pos++;render();window.scrollTo({top:0,behavior:"smooth"})}else finish()});
function finish(){$("play").style.display="none";$("result").style.display="block";$("score").textContent=score;const rate=Math.round(score/QUESTIONS.length*100);$("message").textContent=rate===100?"全問正解です。長さと推測されにくさをよく見分けられています。":rate>=80?"よくできました。見た目が複雑でも定番パターンには注意しましょう。":"文字種だけでなく、長さ・意味・規則性にも注目してみましょう。";const r=$("review");r.innerHTML="";history.forEach((h,i)=>{const d=document.createElement("div");d.className="reviewitem";d.textContent=`${h.correct?"○":"×"} ${i+1}. ${h.password}　選択：${h.selected} ／ 正解：${h.expected}`;r.appendChild(d)});window.scrollTo({top:0,behavior:"smooth"})}
$("restart").addEventListener("click",start);start();
</script></body></html>
